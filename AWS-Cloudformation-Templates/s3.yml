AWSTemplateFormatVersion: '2010-09-09'
Metadata: 
  License: Apache-2.0
Description: 'Organizational level AWS CloudFormation Template for S3 Bucket Creation'
Parameters:
  Environment:
    Description: Deployment environment (e.g., Development, Staging, Production)
    Type: String
    Default: Development
    AllowedValues: [Development, Staging, Production]
​
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: example-organization-bucket-123 # Example bucket name
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: example-organization-bucket-123
        - Key: Environment
          Value: !Ref 'Environment'
​
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Sid: AllowSecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: !Sub 'arn:aws:s3:::${S3Bucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
​
Outputs:
  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref 'S3Bucket'
  BucketARN:
    Description: ARN of the S3 bucket
    Value: !GetAtt 'S3Bucket.Arn'